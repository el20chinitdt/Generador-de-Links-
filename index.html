<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Producciones El Chini | Generador de links</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --panel-nested: #1b2333;
      --accent: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --accent-color: #00f2fe;
      --text: #f5f7fa;
      --muted: #8a99ad;
      --border: rgba(255, 255, 255, 0.06);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    header {
      margin-bottom: 24px;
      text-align: left;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .studio-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 1024px) {
      .studio-grid {
        grid-template-columns: 450px 1fr;
        align-items: start;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title-left::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent-color);
      border-radius: 50%;
    }

    .counter {
      font-size: 11px;
      color: var(--muted);
      font-weight: normal;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-nested);
      color: #fff;
      box-sizing: border-box;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    #code-input {
      min-height: 320px;
      flex-grow: 1;
    }

    .actions-bar {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #05070a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--panel-nested);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .output-section {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: var(--panel-nested);
      border: 1px solid var(--border);
    }

    .output-section label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #result-link {
      min-height: 50px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 12px;
    }

    .player-wrap {
      border-radius: 8px;
      overflow: hidden !important; 
      background: #000;
      border: 1px solid var(--border);
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      color: var(--muted);
      font-size: 13px;
      gap: 12px;
      background: linear-gradient(135deg, #131a26 0%, #0b0f17 100%);
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
      overflow: hidden !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container" id="main-ui">
    <header>
      <h1>Producciones El Chini — Generador de links</h1>
    </header>

    <div class="studio-grid">
      <div class="card">
        <div class="card-title">
          <div class="card-title-left">Editor de Código</div>
          <div class="counter" id="char-counter">0 caracteres</div>
        </div>
        <textarea id="code-input" placeholder="Pegá cualquier código HTML/JS aquí..."></textarea>
        
        <div class="actions-bar">
          <button class="btn" id="btn-generate" type="button">Generar Link</button>
          <div class="btn-group">
            <button class="btn btn-secondary" id="btn-copy" type="button">Copiar</button>
            <button class="btn btn-secondary" id="btn-open" type="button">Abrir</button>
          </div>
        </div>

        <div class="output-section hidden" id="result-section">
          <label>Link Generado Listo para Usar</label>
          <textarea id="result-link" readonly></textarea>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <div class="card-title-left">Vista Previa Adaptativa</div>
        </div>
        <div class="player-wrap">
          <div class="preview-placeholder" id="preview-placeholder">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span>Esperando código para previsualizar...</span>
          </div>
          <iframe id="player-frame" class="hidden" scrolling="no" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; screen-wake-lock; orientation-lock"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const codeInput = document.getElementById('code-input');
      const btnGenerate = document.getElementById('btn-generate');
      const btnCopy = document.getElementById('btn-copy');
      const btnOpen = document.getElementById('btn-open');
      const resultSection = document.getElementById('result-section');
      const resultLink = document.getElementById('result-link');
      const previewPlaceholder = document.getElementById('preview-placeholder');
      const playerFrame = document.getElementById('player-frame');
      const charCounter = document.getElementById('char-counter');

      function safeEncode(str) {
        const bytes = new TextEncoder().encode(str);
        let binString = "";
        for (let i = 0; i < bytes.byteLength; i++) {
          binString += String.fromCharCode(bytes[i]);
        }
        return btoa(binString)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      }

      function safeDecode(str) {
        str = str.replace(/-/g, '+').replace(/_/g, '/');
        while (str.length % 4) {
          str += '=';
        }
        const binString = atob(str);
        const bytes = Uint8Array.from(binString, (c) => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function updateCounter() {
        charCounter.textContent = `${codeInput.value.length.toLocaleString()} caracteres`;
      }
      codeInput.addEventListener('input', updateCounter);

      function makeAdaptiveHtml(rawContent) {
        return `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box !important; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: #000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    iframe, video, object, embed, canvas, .video-js, .jwplayer, div[id*="player"], div[class*="player"] {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      border: 0 !important;
      object-fit: contain !important;
    }
  </style>
</head>
<body>
  ${rawContent}
</body>
</html>`;
      }

      function buildEmbedUrl(content) {
        const encoded = safeEncode(content);
        return `${location.origin}${location.pathname}#embed=1&cfg=${encoded}`;
      }

      function generateLink() {
        const content = codeInput.value.trim();
        if (!content) {
          alert('Por favor, ingresá un código primero.');
          return '';
        }

        const link = buildEmbedUrl(content);
        resultLink.value = link;
        resultSection.classList.remove('hidden');

        playerFrame.srcdoc = makeAdaptiveHtml(content);
        previewPlaceholder.classList.add('hidden');
        playerFrame.classList.remove('hidden');

        return link;
      }

      btnGenerate.addEventListener('click', generateLink);

      btnCopy.addEventListener('click', async () => {
        const link = resultLink.value.trim() || generateLink();
        if (!link) return;

        try {
          await navigator.clipboard.writeText(link);
          btnCopy.textContent = '¡Copiado!';
          setTimeout(() => btnCopy.textContent = 'Copiar', 1500);
        } catch (e) {
          resultLink.focus();
          resultLink.select();
          document.execCommand('copy');
        }
      });

      btnOpen.addEventListener('click', () => {
        const link = resultLink.value.trim() || generateLink();
        if (!link) return;
        window.open(link, '_blank');
      });

      const parseParams = () => {
        const hash = location.hash.substring(1);
        const search = location.search.substring(1);
        const params = new URLSearchParams(hash || search);
        return params;
      };

      const params = parseParams();
      const embed = params.get('embed');
      const cfg = params.get('cfg');

      if (embed === '1' && cfg) {
        try {
          const mainUi = document.getElementById('main-ui');
          if (mainUi) mainUi.remove();

          const rawContent = safeDecode(cfg);

          document.documentElement.style.cssText = "margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;";
          document.body.style.cssText = "margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;";

          const finalFrame = document.createElement('iframe');
          finalFrame.style.cssText = "width:100vw;height:100vh;border:0;display:block;margin:0;padding:0;position:fixed;top:0;left:0;z-index:999999;overflow:hidden;";
          finalFrame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; screen-wake-lock; orientation-lock');
          finalFrame.setAttribute('allowfullscreen', 'true');
          finalFrame.srcdoc = makeAdaptiveHtml(rawContent);

          document.body.appendChild(finalFrame);

        } catch (e) {
          console.error("Error al decodificar:", e);
          document.body.innerHTML = '<div style="color:#fff; padding:20px; font-family:sans-serif; text-align:center;"><h3>Error al cargar el contenido</h3><p>Asegurate de haber copiado el enlace completo.</p></div>';
        }
      }
    });
  </script>
</body>
</html>
